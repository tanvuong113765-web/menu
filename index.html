<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vuongpham x elitemodz - RGB Floating Menu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Hiệu ứng viền 7 màu (RGB Rainbow Animation) */
        @keyframes rgbBorder {
            0% { border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
            20% { border-color: #ff9900; box-shadow: 0 0 15px rgba(255, 153, 0, 0.6); }
            40% { border-color: #33ff00; box-shadow: 0 0 15px rgba(51, 255, 0, 0.6); }
            60% { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.6); }
            80% { border-color: #9900ff; box-shadow: 0 0 15px rgba(153, 0, 255, 0.6); }
            100% { border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        }

        /* Khung giao diện chính (App Container) */
        .app-container {
            width: 100%;
            max-width: 380px;
            background-color: #1a1a1a;
            border: 4px solid #ff0000;
            border-radius: 20px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            position: relative;
            animation: rgbBorder 6s infinite linear;
        }

        .app-title-box {
            width: 100%;
            background-color: #000;
            border: 3px solid #00ffff;
            border-radius: 12px;
            padding: 15px 0;
            text-align: center;
            margin-bottom: 20px;
            animation: rgbBorder 6s infinite linear;
        }
        .app-title {
            font-size: 22px;
            font-weight: 900;
            color: #00ffff;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #00ffff;
        }
        .app-subtitle {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.4);
        }

        .toggle-app-btn {
            width: 100%;
            padding: 20px 0;
            font-size: 22px;
            font-weight: bold;
            background-color: #fff;
            color: #000;
            border: 3px solid #ff0000;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
            animation: rgbBorder 6s infinite linear;
        }
        .toggle-app-btn.active {
            background-color: #2ecc71;
            color: #fff;
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.8);
        }

        /* KHU VỰC MÔ PHỎNG NGOÀI MÀN HÌNH (Đã bỏ màu nền mờ để thao tác xuyên thấu phía sau) */
        .desktop-simulator {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Cho phép chạm xuyên qua màn hình mô phỏng vào các ứng dụng bên dưới */
            display: none;
            z-index: 1000;
        }
        .desktop-simulator.show {
            display: block;
        }

        /* Bong bóng nổi MENU (Vẫn nhận tương tác kéo/chạm bình thường) */
        .floating-bubble {
            width: 75px;
            height: 75px;
            background-color: #00bcd4;
            border: 3px solid #ff0000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            cursor: grab;
            position: absolute;
            top: 50px;
            left: 50px;
            pointer-events: auto; /* Bật lại tương tác riêng cho bong bóng */
            animation: rgbBorder 5s infinite linear;
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.8);
            z-index: 1001;
            touch-action: none;
        }
        .floating-bubble:active {
            cursor: grabbing;
        }

        /* Bảng Menu chính (Vẫn nhận tương tác khi hiển thị) */
        .floating-menu-box {
            position: absolute;
            top: 50px;
            left: 140px;
            width: 270px;
            background-color: #111;
            border: 3px solid #ff0000;
            border-radius: 15px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto; /* Bật lại tương tác cho bảng menu */
            animation: rgbBorder 6s infinite linear;
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
            z-index: 1002;
            touch-action: none;
        }
        .floating-menu-box.show {
            display: flex;
        }

        .menu-header {
            font-size: 15px;
            font-weight: 900;
            color: #00ffff;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
            cursor: move;
        }

        .menu-feature-btn {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            background-color: #222;
            color: #fff;
            border: 2px solid #555;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .menu-feature-btn.active {
            background-color: #2ecc71;
            color: #fff;
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
        }

        .hide-menu-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 10px rgba(231, 76, 60, 0.5);
            transition: 0.2s;
        }
        .hide-menu-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- GIAO DIỆN TRONG APP -->
    <div class="app-container">
        <div class="app-title-box">
            <div class="app-title">VUONGPHAM</div>
        </div>
        <div class="app-subtitle">MENU NHỆ TÂM ⚡</div>
        
        <button class="toggle-app-btn" id="main-toggle-btn" onclick="toggleAppMode()">ON</button>
    </div>

    <!-- KHU VỰC MÔ PHỎNG NGOÀI MÀN HÌNH -->
    <div class="desktop-simulator" id="desktop-sim">
        <!-- Bong bóng nổi MENU (Kéo thả được) -->
        <div class="floating-bubble" id="float-bubble" onclick="openMenuBox()">MENU</div>

        <!-- Bảng Menu chi tiết (Kéo thả được) -->
        <div class="floating-menu-box" id="float-menu-box">
            <div class="menu-header" id="menu-drag-handle">MENU BY VUONGPHAM</div>
            
            <button class="menu-feature-btn" id="btn-sens" onclick="toggleFeature('sens')">
                SENSITIVITY 50% ⚙️
            </button>

            <button class="menu-feature-btn" id="btn-vibrate" onclick="toggleFeature('vibrate')">
                FIX RUNG 50% ⚡
            </button>

            <button class="hide-menu-btn" onclick="hideMenuBox()">ẨN</button>
        </div>
    </div>

    <script>
        let isAppActive = false;

        function toggleAppMode() {
            isAppActive = !isAppActive;
            const btn = document.getElementById('main-toggle-btn');
            const sim = document.getElementById('desktop-sim');
            const menuBox = document.getElementById('float-menu-box');

            if (isAppActive) {
                btn.innerText = "OFF";
                btn.classList.add('active');
                sim.classList.add('show');
                menuBox.classList.remove('show');
            } else {
                btn.innerText = "ON";
                btn.classList.remove('active');
                sim.classList.remove('show');
            }
        }

        function openMenuBox() {
            document.getElementById('float-menu-box').classList.add('show');
        }

        const featureStates = { sens: false, vibrate: false };
        function toggleFeature(featureKey) {
            featureStates[featureKey] = !featureStates[featureKey];
            const btn = document.getElementById(`btn-${featureKey}`);
            if (featureStates[featureKey]) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function hideMenuBox() {
            document.getElementById('float-menu-box').classList.remove('show');
        }

        /* --- TÍNH NĂNG KÉO THẢ TỰ DO (Draggable cho cả Chuột và Cảm ứng điện thoại) --- */
        function makeDraggable(element) {
            let posX = 0, posY = 0, mouseX = 0, mouseY = 0;

            element.onmousedown = dragMouseDown;
            element.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e.preventDefault();
                mouseX = e.clientX;
                mouseY = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                posX = mouseX - e.clientX;
                posY = mouseY - e.clientY;
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                element.style.top = (element.offsetTop - posY) + "px";
                element.style.left = (element.offsetLeft - posX) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }

            function dragTouchStart(e) {
                if(e.touches.length === 1) {
                    mouseX = e.touches[0].clientX;
                    mouseY = e.touches[0].clientY;
                    document.ontouchend = closeTouchDrag;
                    document.ontouchmove = elementTouchDrag;
                }
            }

            function elementTouchDrag(e) {
                if(e.touches.length === 1) {
                    posX = mouseX - e.touches[0].clientX;
                    posY = mouseY - e.touches[0].clientY;
                    mouseX = e.touches[0].clientX;
                    mouseY = e.touches[0].clientY;

                    element.style.top = (element.offsetTop - posY) + "px";
                    element.style.left = (element.offsetLeft - posX) + "px";
                }
            }

            function closeTouchDrag() {
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }

        // Kích hoạt tính năng kéo thả cho cả bong bóng nổi và bảng menu
        makeDraggable(document.getElementById("float-bubble"));
        makeDraggable(document.getElementById("float-menu-box"));
    </script>
</body>
</html>
